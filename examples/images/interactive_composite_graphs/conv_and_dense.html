  <footer>
    <span class="status" id="status" role="status">Scroll to zoom · Drag to move</span>
    <span class="meta" id="zoom-level"></span>
  </footer>
</main>
<script>
  "use strict";

  const viewport = document.getElementById("viewport");
  const svg = viewport.querySelector("svg");
  const original = svg.viewBox.baseVal;
  const bounds = { x: original.x, y: original.y, w: original.width, h: original.height };
  const status = document.getElementById("status");
  const zoomLevel = document.getElementById("zoom-level");
  const search = document.getElementById("search");
  const nodes = [...svg.querySelectorAll("g.node")].map(element => ({
    element,
    name: element.querySelector("title").textContent,
  }));

  let x, y, units;
  let drag = null;
  let selected = null;
  let lastQuery = "";
  let matchIndex = 0;
  let fitted = true;

  function fitUnits() {
    return Math.max(bounds.w / viewport.clientWidth, bounds.h / viewport.clientHeight) * 1.035;
  }

  function draw() {
    const w = viewport.clientWidth * units;
    const h = viewport.clientHeight * units;
    svg.setAttribute("viewBox", [x - w / 2, y - h / 2, w, h].join(" "));
    zoomLevel.textContent = Math.round(100 * fitUnits() / units) + "% of fit";
  }

  function fit() {
    fitted = true;
    x = bounds.x + bounds.w / 2;
    y = bounds.y + bounds.h / 2;
    units = fitUnits();
    draw();
  }

  function zoom(factor, clientX, clientY) {
    fitted = false;
    const rect = viewport.getBoundingClientRect();
    const dx = clientX === undefined ? 0 : clientX - rect.left - rect.width / 2;
    const dy = clientY === undefined ? 0 : clientY - rect.top - rect.height / 2;
    const next = Math.min(fitUnits() * 6, Math.max(.035, units * factor));
    x += dx * (units - next);
    y += dy * (units - next);
    units = next;
    draw();
  }

  viewport.addEventListener("wheel", event => {
    event.preventDefault();
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1);
    const factor = Math.exp(Math.max(-1, Math.min(1, delta * .0014)));
    zoom(factor, event.clientX, event.clientY);
  }, { passive: false });

  viewport.addEventListener("pointerdown", event => {
    if (event.button !== 0 || drag !== null) return;
    viewport.focus({ preventScroll: true });
    viewport.setPointerCapture(event.pointerId);
    drag = { id: event.pointerId, left: event.clientX, top: event.clientY, x, y };
    viewport.classList.add("dragging");
  });

  viewport.addEventListener("pointermove", event => {
    if (drag?.id !== event.pointerId) return;
    fitted = false;
    x = drag.x - (event.clientX - drag.left) * units;
    y = drag.y - (event.clientY - drag.top) * units;
    draw();
  });

  viewport.addEventListener("lostpointercapture", () => {
    drag = null;
    viewport.classList.remove("dragging");
  });

  viewport.addEventListener("keydown", event => {
    const step = 65 * units;
    switch (event.key) {
      case "ArrowLeft": x -= step; break;
      case "ArrowRight": x += step; break;
      case "ArrowUp": y -= step; break;
      case "ArrowDown": y += step; break;
      case "+": case "=": event.preventDefault(); zoom(.8); return;
      case "-": event.preventDefault(); zoom(1.25); return;
      case "0": event.preventDefault(); fit(); return;
      default: return;
    }
    event.preventDefault();
    fitted = false;
    draw();
  });

  document.getElementById("zoom-in").addEventListener("click", () => zoom(.8));
  document.getElementById("zoom-out").addEventListener("click", () => zoom(1.25));
  document.getElementById("fit").addEventListener("click", fit);

  function focusNode(node) {
    selected?.classList.remove("selected");
    selected = node.element;
    selected.classList.add("selected");
    const box = selected.getBBox();
    const transform = svg.getScreenCTM().inverse().multiply(selected.getScreenCTM());
    const center = new DOMPoint(box.x + box.width / 2, box.y + box.height / 2).matrixTransform(transform);
    fitted = false;
    x = center.x;
    y = center.y;
    units = Math.min(units, .7);
    draw();
  }

  document.getElementById("search-form").addEventListener("submit", event => {
    event.preventDefault();
    const query = search.value.trim().toLowerCase();
    if (!query) return;
    const exact = nodes.find(node => node.name.toLowerCase() === query);
    const matches = exact ? [exact] : nodes.filter(node => node.name.toLowerCase().includes(query));
    if (!matches.length) {
      status.textContent = "No matching node.";
      return;
    }
    matchIndex = query === lastQuery ? (matchIndex + 1) % matches.length : 0;
    lastQuery = query;
    const node = matches[matchIndex];
    focusNode(node);
    status.textContent = matches.length > 1
      ? node.name + " · " + (matchIndex + 1) + " of " + matches.length + " · Press Enter for the next match"
      : node.name;
  });

  search.addEventListener("input", () => {
    lastQuery = "";
    if (!search.value) {
      selected?.classList.remove("selected");
      selected = null;
      status.textContent = "Scroll to zoom · Drag to move";
    }
  });

  if (false) {
    const edges = [...svg.querySelectorAll("g.edge")].filter(edge =>
      edge.querySelector("title").textContent.startsWith("scale->"));
    if (edges.length) {
      edges.forEach(edge => edge.classList.add("scale-edge"));
      document.getElementById("scale-label").textContent = "Show scale links (" + edges.length + ")";
      document.getElementById("scale-toggle").hidden = false;
      const checkbox = document.getElementById("scale-links");
      svg.classList.add("hide-scale");
      checkbox.addEventListener("change", () => svg.classList.toggle("hide-scale", !checkbox.checked));
    }
  }

  fit();
  new ResizeObserver(() => fitted ? fit() : draw()).observe(viewport);
</script>
